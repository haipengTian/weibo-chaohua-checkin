name: Multi-user platform tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    # 仅构建发布时，可通过提交消息明确跳过本次整套测试。
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check --select E4,E7,E9,F,I portal.py portal_db.py portal_security.py portal_tasks.py portal_weibo.py portal_manage.py portal_runtime.py tests
      - run: ruff format --check portal.py portal_db.py portal_security.py portal_tasks.py portal_weibo.py portal_manage.py portal_runtime.py tests
      - run: python -m compileall -q portal.py portal_db.py portal_security.py portal_tasks.py portal_weibo.py portal_manage.py portal_runtime.py weibo.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
