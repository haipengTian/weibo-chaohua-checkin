<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="csp-nonce" content="__CSP_STYLE_NONCE__" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 · 超话签到</title>
    <meta name="registration-enabled" content="__REGISTRATION_ENABLED__" />
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/portal.css" />
    <link rel="stylesheet" href="/assets/components/credit-controls.css" />
    <script src="/assets/theme.js"></script>
    <script src="/assets/login.js" defer></script>
    <script src="/assets/components/credit-controls.js" type="module"></script>
  </head>
  <body>
    <main class="login-shell">
      <div class="login-aurora" aria-hidden="true"></div>
      <button id="theme-toggle" class="icon-button login-theme" type="button" aria-label="深色模式" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.4A9 9 0 0 1 10.6 3.1a9 9 0 1 0 10.3 10.3Z"/></svg>
      </button>
      <div class="auth-box">
        <header class="login-heading">
          <h1>超话 <em lang="en">Check-in</em></h1>
          <p>管理你的微博账号与每日签到计划</p>
        </header>
        <div class="auth-form-surface" data-credit-form="login"></div>
        <p class="auth-help">登录后用微博 App 扫码绑定，无需提供微博密码。</p>
      </div>
    </main>
  </body>
</html>
